<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이름표 QR 인쇄 · QR 계산대</title>
  <link rel="stylesheet" href="style.css?v=20261102a">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* A4 - 여백 8mm → 194×281mm, 2열×5행 = 한 장 10명 */
    .sheet {
      width: 194mm;
      height: 279mm;
      margin: 16px auto;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border-top: 1px dashed #888;
      border-left: 1px dashed #888;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    .tag {
      display: flex;
      align-items: center;
      gap: 5mm;
      padding: 4mm 5mm;
      border-right: 1px dashed #888;
      border-bottom: 1px dashed #888;
      overflow: hidden;
    }
    .tag .qr img, .tag .qr canvas { width: 40mm; height: 40mm; display: block; }
    .tag .info { flex: 1; min-width: 0; }
    .tag .t-title { font-size: 9pt; font-weight: 800; color: #2563eb; letter-spacing: 0.5px; }
    .tag .t-grade { font-size: 15pt; font-weight: 700; margin-top: 2mm; }
    .tag .t-name { font-size: 24pt; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
    .tag .t-tip { font-size: 7.5pt; color: #555; margin-top: 3mm; line-height: 1.35; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .controls select { font: inherit; font-size: 18px; padding: 8px 10px; border-radius: 10px; border: 1px solid #cbd5e1; }
    .warn { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: #fef2f2; color: var(--danger); font-weight: 700; }

    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      html, body { background: #fff; height: auto; }
      .screen-only { display: none !important; }
      .sheet { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="screen-only">
    <header class="topbar">
      <a class="brand" href="index.html">QR 계산대</a>
      <nav>
        <a href="index.html">계산대</a>
        <a href="sales.html">판매 내역</a>
        <a href="admin.html">상품·설정</a>
      </nav>
    </header>
    <div class="page">
      <h1>🪪 참가자 이름표 QR</h1>
      <div class="card controls">
        <button class="btn" id="loadBtn">시트에서 명단 불러오기</button>
        <label>학년 <select id="gradeSel"><option value="">전체</option></select></label>
        <span id="countText" style="font-weight:700"></span>
        <button class="btn primary" id="printBtn" disabled>인쇄</button>
      </div>
      <div class="warn hidden" id="localWarn">
        지금 주소가 localhost라서, 이 이름표를 폰 카메라로 찍으면 "내 달란트" 화면이 열리지 않아요. (판매처 결제는 정상 동작)<br>
        실제 인쇄는 GitHub Pages 주소에서 이 페이지를 열어서 해주세요.
      </div>
      <p class="hint">한 장에 10명 · QR 4cm · 이름표 QR을 폰 카메라로 찍으면 본인 잔액 화면이 열려요</p>
    </div>
  </div>

  <div id="sheets"></div>

  <script src="config.js?v=20261102a"></script>
  <script src="data.js?v=20261102a"></script>
  <script src="common.js?v=20261102a"></script>
  <script src="api.js?v=20261102a"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PER_PAGE = 10;
    const walletBase = new URL('wallet.html', location.href).href.split('?')[0];
    let people = [];

    $('localWarn').classList.toggle('hidden', !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname));

    function render() {
      const grade = $('gradeSel').value;
      const list = people.filter((p) => !grade || p.grade === grade);
      $('countText').textContent = `${list.length}명 · A4 ${Math.ceil(list.length / PER_PAGE)}장`;
      $('printBtn').disabled = list.length === 0;
      const container = $('sheets');
      container.innerHTML = '';
      for (let i = 0; i < list.length; i += PER_PAGE) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        list.slice(i, i + PER_PAGE).forEach((p) => {
          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.innerHTML = `<div class="qr"></div>
            <div class="info">
              <div class="t-title">달란트 카드</div>
              <div class="t-grade">${escapeHtml(p.grade)}</div>
              <div class="t-name">${escapeHtml(p.name)}</div>
              <div class="t-tip">계산할 때 이 QR을 보여주세요<br>폰 카메라로 찍으면 내 잔액 확인</div>
            </div>`;
          new QRCode(tag.querySelector('.qr'), { text: `${walletBase}?c=${p.code}`, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
          sheet.appendChild(tag);
        });
        container.appendChild(sheet);
      }
    }

    $('loadBtn').addEventListener('click', async () => {
      $('loadBtn').disabled = true;
      $('countText').textContent = '불러오는 중…';
      const r = await api('roster');
      $('loadBtn').disabled = false;
      if (!r.ok) {
        $('countText').textContent = '';
        return alert('명단을 불러오지 못했어요: ' + apiErrorText(r) + '\n[상품·설정]에서 시트 주소와 비밀번호를 확인하세요.');
      }
      people = r.people;
      const grades = [...new Set(people.map((p) => p.grade))];
      $('gradeSel').innerHTML = '<option value="">전체</option>' + grades.map((g) => `<option>${escapeHtml(g)}</option>`).join('');
      render();
    });
    $('gradeSel').addEventListener('change', render);
    $('printBtn').addEventListener('click', () => window.print());
  </script>
</body>
</html>
