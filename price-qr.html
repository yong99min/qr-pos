<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 인쇄 · QR 계산대</title>
  <link rel="stylesheet" href="style.css?v=20261102a">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* A4 - 여백 8mm → 194×281mm, 4열×5행 = 한 장 20개 */
    .sheet {
      width: 194mm;
      height: 279mm;
      margin: 16px auto;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border-top: 1px dashed #888;
      border-left: 1px dashed #888;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1mm;
      padding: 1mm;
      border-right: 1px dashed #888;
      border-bottom: 1px dashed #888;
      overflow: hidden;
      text-align: center;
    }
    .cell .qr img, .cell .qr canvas { width: 38mm; height: 38mm; display: block; }
    .cell .name { font-size: 12pt; font-weight: 800; line-height: 1.15; max-height: 2.4em; overflow: hidden; }
    .cell .amt { font-size: 15pt; font-weight: 900; }
    .cell.amount-only .amt { font-size: 18pt; }

    .list { width: 100%; border-collapse: collapse; }
    .list td { padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 18px; }
    .list td.price { text-align: right; color: var(--muted); font-weight: 700; white-space: nowrap; }
    .list td.ctrl { width: 1%; white-space: nowrap; }
    .qty-ctrl button.wide { width: auto; padding: 0 10px; font-size: 16px; }
    .qty-ctrl .qty { min-width: 44px; }
    .list input {
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      width: 110px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      text-align: right;
    }
    .summary { font-size: 18px; font-weight: 800; }

    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      html, body { background: #fff; height: auto; }
      .screen-only { display: none !important; }
      .sheet { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="screen-only">
    <header class="topbar">
      <a class="brand" href="index.html">QR 계산대</a>
      <nav>
        <a href="index.html">계산대</a>
        <a href="sales.html">판매 내역</a>
        <a href="admin.html">상품·설정</a>
      </nav>
    </header>
    <div class="page">
      <h1>🏷️ QR 인쇄</h1>

      <div class="card">
        <h2 style="margin-top:0">🎁 물품 <small style="color:var(--muted);font-weight:600">(data.js 목록 · QR에 상품명+가격 표시)</small></h2>
        <table class="list"><tbody id="goodsRows"></tbody></table>
        <div class="toolbar" style="margin-bottom:0">
          <button class="btn small" id="allPageBtn">전부 한 장(20개)씩</button>
          <button class="btn small" id="allZeroBtn">전부 0개</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2 style="margin-top:0">➕ 금액만 있는 QR <small style="color:var(--muted);font-weight:600">(목록에 없는 물건용)</small></h2>
        <table class="list"><tbody id="extraRows"></tbody></table>
        <div class="toolbar" style="margin-bottom:0">
          <button class="btn small" id="addExtraBtn">+ 금액 추가</button>
        </div>
      </div>

      <div class="toolbar" style="align-items:center">
        <span class="summary" id="summary"></span>
        <button class="btn primary" id="printBtn">인쇄 / PDF 저장</button>
      </div>
      <p class="hint">[+] 1개, [+20] A4 한 장. 인쇄 창에서 대상을 "PDF로 저장"으로 바꾸면 PDF로 받을 수 있어요.</p>
    </div>
  </div>

  <div id="sheets"></div>

  <script src="data.js?v=20261102a"></script>
  <script src="common.js?v=20261102a"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PER_PAGE = 20;
    const STORE = 'pos_print_counts';
    const saved = load(STORE, {});
    let goodsQty = saved.goods || {};         // { 상품id: 개수 }
    let extras = saved.extras || [];          // [{ price, qty }]

    function persist() { save(STORE, { goods: goodsQty, extras }); }

    function qtyCtrl(attr, qty) {
      return `<div class="qty-ctrl" ${attr}>
        <button class="wide" data-d="-20">−20</button>
        <button data-d="-1">−</button>
        <span class="qty">${qty}</span>
        <button data-d="1">+</button>
        <button class="wide" data-d="20">+20</button>
      </div>`;
    }

    function render() {
      $('goodsRows').innerHTML = GOODS.length
        ? GOODS.map((g) => `
          <tr>
            <td><b>${escapeHtml(g.name)}</b></td>
            <td class="price">${won(g.price)}</td>
            <td class="ctrl">${qtyCtrl(`data-goods="${escapeHtml(g.id)}"`, goodsQty[g.id] || 0)}</td>
          </tr>`).join('')
        : '<tr><td>data.js 에 물품이 없어요</td></tr>';

      $('extraRows').innerHTML = extras.length
        ? extras.map((x, i) => `
          <tr>
            <td><input type="number" min="1" step="1" value="${x.price || ''}" data-price="${i}" placeholder="금액"> 달란트</td>
            <td class="ctrl">${qtyCtrl(`data-extra="${i}"`, x.qty)}</td>
            <td class="ctrl"><button class="btn small danger" data-del="${i}">삭제</button></td>
          </tr>`).join('')
        : '<tr><td style="color:var(--muted)">없음</td></tr>';
      renderSheets();
    }

    function renderSheets() {
      const cells = [];
      GOODS.forEach((g) => { for (let n = 0; n < (goodsQty[g.id] || 0); n++) cells.push({ qr: g.id, name: g.name, price: g.price }); });
      extras.forEach((x) => { if (x.price > 0) for (let n = 0; n < x.qty; n++) cells.push({ qr: 'AMT:' + x.price, price: x.price }); });

      const pages = Math.ceil(cells.length / PER_PAGE);
      $('summary').textContent = `총 ${cells.length}개 · A4 ${pages}장`;
      $('printBtn').disabled = cells.length === 0;

      const container = $('sheets');
      container.innerHTML = '';
      for (let p = 0; p < pages; p++) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        cells.slice(p * PER_PAGE, (p + 1) * PER_PAGE).forEach((c) => {
          const cell = document.createElement('div');
          cell.className = 'cell' + (c.name ? '' : ' amount-only');
          cell.innerHTML = `<div class="qr"></div>${c.name ? `<div class="name">${escapeHtml(c.name)}</div>` : ''}<div class="amt">${won(c.price)}</div>`;
          new QRCode(cell.querySelector('.qr'), { text: c.qr, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
          sheet.appendChild(cell);
        });
        container.appendChild(sheet);
      }
    }

    document.querySelector('.page').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.d) {
        const ctrl = btn.closest('.qty-ctrl');
        const d = Number(btn.dataset.d);
        if (ctrl.dataset.goods) {
          goodsQty[ctrl.dataset.goods] = Math.max(0, (goodsQty[ctrl.dataset.goods] || 0) + d);
        } else {
          const x = extras[ctrl.dataset.extra];
          x.qty = Math.max(0, x.qty + d);
        }
      } else if (btn.dataset.del !== undefined) {
        extras.splice(Number(btn.dataset.del), 1);
      } else if (btn.id === 'addExtraBtn') {
        extras.push({ price: 0, qty: 20 });
      } else if (btn.id === 'allPageBtn') {
        GOODS.forEach((g) => { goodsQty[g.id] = PER_PAGE; });
      } else if (btn.id === 'allZeroBtn') {
        goodsQty = {};
      } else if (btn.id === 'printBtn') {
        return window.print();
      } else return;
      persist();
      render();
      if (btn.id === 'addExtraBtn') {
        const inputs = document.querySelectorAll('[data-price]');
        inputs[inputs.length - 1].focus();
      }
    });

    $('extraRows').addEventListener('change', (e) => {
      if (e.target.dataset.price === undefined) return;
      extras[e.target.dataset.price].price = Math.max(0, Math.round(Number(e.target.value) || 0));
      persist();
      renderSheets();
    });

    render();
  </script>
</body>
</html>
