<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설정 · QR 계산대</title>
  <link rel="stylesheet" href="style.css?v=20261101a">
  <style>
    .ro-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .ro-item { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #f9fafb; font-size: 17px; }
    .ro-item b { overflow-wrap: anywhere; }
    .ro-item span { color: var(--muted); font-weight: 700; white-space: nowrap; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .links .btn { text-decoration: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">QR 계산대</a>
    <nav>
      <a href="index.html">계산대</a>
      <a href="sales.html">판매 내역</a>
      <a href="admin.html" class="active">상품·설정</a>
    </nav>
  </header>

  <div class="page">
    <h1>설정</h1>

    <form class="card" id="sheetForm" autocomplete="off">
      <h2 style="margin-top:0">구글 시트 연결 <small style="color:var(--muted);font-weight:600">(판매 기기마다 한 번)</small></h2>
      <div class="form-row">
        <label>시트 웹앱 주소 <input id="sUrl" class="url" placeholder="https://script.google.com/macros/s/…/exec 또는 test"></label>
      </div>
      <div class="form-row" style="margin-top:12px">
        <label>판매처 비밀번호 <input id="sKey" placeholder="시트 메뉴 ③에서 확인"></label>
        <label>기기 이름 <input id="sDevice" placeholder="예: 물품1"></label>
        <button type="submit" class="btn primary">저장</button>
        <button type="button" class="btn" id="testBtn">연결 테스트</button>
        <span id="testResult" class="test-result"></span>
      </div>
      <p class="hint">테스트 모드: 주소 <b>test</b> + 비밀번호 <b>1234</b> → 구글 시트 없이 이 브라우저 안에서만 동작 (기기끼리 공유 안 됨)</p>
    </form>

    <div class="links">
      <a class="btn primary" href="price-qr.html">🏷️ 물품·가격 QR 인쇄</a>
      <a class="btn primary" href="cards.html">🪪 참가자 이름표 QR 인쇄</a>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0">🍢 음식 메뉴 <small style="color:var(--muted);font-weight:600">(고정 · data.js에서 수정)</small></h2>
      <div class="ro-list" id="foodList"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0">🎁 물품 목록 <small style="color:var(--muted);font-weight:600">(고정 · data.js에서 수정)</small></h2>
      <div class="ro-list" id="goodsList"></div>
    </div>
  </div>

  <script src="config.js?v=20261101a"></script>
  <script src="data.js?v=20261101a"></script>
  <script src="common.js?v=20261101a"></script>
  <script src="api.js?v=20261101a"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function fillSettings() {
      const s = getSettings();
      $('sUrl').value = s.url;
      $('sKey').value = s.key;
      $('sDevice').value = s.device;
    }

    function sheetValues() {
      return { url: $('sUrl').value.trim(), key: $('sKey').value.trim(), device: $('sDevice').value.trim() };
    }

    $('sheetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      saveSettings(sheetValues());
      showToast('저장했어요', 'ok');
    });

    $('testBtn').addEventListener('click', async () => {
      const v = sheetValues();
      $('testResult').textContent = '확인 중…';
      $('testResult').className = 'test-result';
      const r = await api('ping', {}, { url: v.url, key: v.key });
      $('testResult').textContent = r.ok ? `✅ 연결됨 (${r.title})` : `❌ ${apiErrorText(r)}`;
      $('testResult').className = 'test-result ' + (r.ok ? 'ok' : 'err');
      if (r.ok) saveSettings(v);
    });

    const item = (name, price, sub = '') => `<div class="ro-item"><b>${escapeHtml(name)}${sub}</b><span>${won(price)}</span></div>`;
    $('foodList').innerHTML = FOODS.map((f) => item(f.name, f.price)).join('');
    $('goodsList').innerHTML = GOODS.length
      ? GOODS.map((g) => item(g.name, g.price, ` <small style="color:var(--muted)">${escapeHtml(g.id)}</small>`)).join('')
      : '<p class="hint">아직 물품이 없어요</p>';

    fillSettings();
  </script>
</body>
</html>
