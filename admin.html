<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설정 · QR 계산대</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .print-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px dashed #999;
      border-left: 1px dashed #999;
    }
    .print-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2mm;
      padding: 5mm 3mm;
      border-right: 1px dashed #999;
      border-bottom: 1px dashed #999;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .print-card .qr canvas, .print-card .qr img { width: 40mm; height: 40mm; }
    .print-card .p-name { font-size: 16pt; font-weight: 800; text-align: center; }
    .print-card .p-price { font-size: 14pt; font-weight: 700; }
    .print-card .p-id { font-size: 9pt; color: #666; }

    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .screen-only { display: none !important; }
      .print-only { display: block; }
    }
  </style>
</head>
<body>
  <div class="screen-only">
    <header class="topbar">
      <a class="brand" href="index.html">QR 계산대</a>
      <nav>
        <a href="index.html">계산대</a>
        <a href="sales.html">판매 내역</a>
        <a href="admin.html" class="active">상품·설정</a>
      </nav>
    </header>

    <div class="page">
      <h1>설정</h1>

      <form class="card" id="sheetForm" autocomplete="off">
        <h2 style="margin-top:0">구글 시트 연결 <small style="color:var(--muted);font-weight:600">(기기마다 한 번)</small></h2>
        <div class="form-row">
          <label>시트 웹앱 주소 <input id="sUrl" class="url" placeholder="https://script.google.com/macros/s/…/exec 또는 test"></label>
        </div>
        <div class="form-row" style="margin-top:12px">
          <label>판매처 비밀번호 <input id="sKey" placeholder="시트 메뉴 ③에서 확인"></label>
          <label>기기 이름 <input id="sDevice" placeholder="예: 물품1"></label>
          <button type="submit" class="btn primary">저장</button>
          <button type="button" class="btn" id="testBtn">연결 테스트</button>
          <span id="testResult" class="test-result"></span>
        </div>
        <p class="hint">테스트 모드: 주소에 <b>test</b>, 비밀번호에 <b>1234</b> → 구글 시트 없이 이 브라우저에서만 동작 (테스트 카드: 아래 이름표 인쇄에서 확인)</p>
      </form>

      <form class="card" id="foodForm" style="margin-top:16px" autocomplete="off">
        <h2 style="margin-top:0">🍢 음식 메뉴 (9개)</h2>
        <div class="food-edit" id="foodEdit"></div>
        <div class="toolbar" style="margin-bottom:0">
          <button type="submit" class="btn primary">음식 메뉴 저장</button>
        </div>
      </form>

      <div class="toolbar" style="margin-top:16px">
        <a class="btn primary" href="cards.html" style="text-decoration:none">🪪 참가자 이름표 QR 인쇄</a>
        <a class="btn primary" href="price-qr.html" style="text-decoration:none">🏷️ 가격 QR 인쇄</a>
      </div>

      <h1 style="margin-top:36px">🎁 물품 상품 관리</h1>

      <form class="card" id="productForm" autocomplete="off">
        <div class="form-row">
          <label>상품 ID <input id="fId" required placeholder="예: P006" maxlength="40"></label>
          <label>상품명 <input id="fName" class="wide" required placeholder="예: 녹차"></label>
          <label>가격(달란트) <input id="fPrice" type="number" min="0" step="1" required placeholder="예: 2500"></label>
          <button type="submit" class="btn primary" id="submitBtn">추가</button>
          <button type="button" class="btn hidden" id="cancelBtn">취소</button>
        </div>
      </form>

      <div class="toolbar">
        <button class="btn primary" id="printBtn">전체 QR 인쇄</button>
        <button class="btn danger" id="restoreBtn">기본 상품으로 되돌리기</button>
      </div>

      <table class="data">
        <thead>
          <tr><th>QR</th><th>ID</th><th>상품명</th><th class="num">가격</th><th></th></tr>
        </thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
  </div>

  <div class="print-only">
    <div class="print-grid" id="printGrid"></div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="api.js"></script>
  <script>
    let products = [];
    let editingId = null;

    const $ = (id) => document.getElementById(id);

    // ---------- 시트 연결 ----------
    function fillSettings() {
      const s = getSettings();
      $('sUrl').value = s.url;
      $('sKey').value = s.key;
      $('sDevice').value = s.device;
      $('foodEdit').innerHTML = s.foods.map((f, i) => `
        <div class="food-row">
          <span class="no">${i + 1}</span>
          <input data-fname="${i}" value="${escapeHtml(f.name)}" placeholder="음식 이름">
          <input data-fprice="${i}" type="number" min="0" step="1" value="${f.price}" placeholder="가격">
        </div>`).join('');
    }

    function sheetValues() {
      return { url: $('sUrl').value.trim(), key: $('sKey').value.trim(), device: $('sDevice').value.trim() };
    }

    $('sheetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      saveSettings(sheetValues());
      showToast('저장했어요', 'ok');
    });

    $('testBtn').addEventListener('click', async () => {
      const v = sheetValues();
      $('testResult').textContent = '확인 중…';
      $('testResult').className = 'test-result';
      const r = await api('ping', {}, { url: v.url, key: v.key });
      $('testResult').textContent = r.ok ? `✅ 연결됨 (${r.title})` : `❌ ${apiErrorText(r)}`;
      $('testResult').className = 'test-result ' + (r.ok ? 'ok' : 'err');
      if (r.ok) saveSettings(v);
    });

    $('foodForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const foods = getSettings().foods.map((_, i) => ({
        name: document.querySelector(`[data-fname="${i}"]`).value.trim() || `음식 ${i + 1}`,
        price: Math.max(0, Math.round(Number(document.querySelector(`[data-fprice="${i}"]`).value) || 0)),
      }));
      saveSettings({ foods });
      showToast('음식 메뉴를 저장했어요', 'ok');
    });

    function makeQr(el, text, size) {
      el.innerHTML = '';
      new QRCode(el, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    }

    function render() {
      const tbody = $('productRows');
      if (products.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">등록된 상품이 없어요</td></tr>';
        return;
      }
      tbody.innerHTML = products.map((p, idx) => `
        <tr class="${p.id === editingId ? 'editing' : ''}">
          <td class="qr-cell"><div data-qr="${idx}"></div></td>
          <td><b>${escapeHtml(p.id)}</b></td>
          <td>${escapeHtml(p.name)}</td>
          <td class="num">${won(p.price)}</td>
          <td class="actions">
            <button class="btn small" data-edit="${idx}">수정</button>
            <button class="btn small danger" data-del="${idx}">삭제</button>
          </td>
        </tr>`).join('');
      tbody.querySelectorAll('[data-qr]').forEach((el) => makeQr(el, products[el.dataset.qr].id, 176));
    }

    function persist() {
      save(KEYS.products, products);
      render();
    }

    function resetForm() {
      editingId = null;
      $('productForm').reset();
      $('submitBtn').textContent = '추가';
      $('cancelBtn').classList.add('hidden');
      render();
    }

    $('productForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = $('fId').value.trim();
      const name = $('fName').value.trim();
      const price = Math.round(Number($('fPrice').value));
      if (!id || !name || !(price >= 0)) return;
      if (/^AMT:/i.test(id)) return alert('"AMT:"로 시작하는 ID는 금액 QR용이라 사용할 수 없어요.');

      const dup = products.find((p) => p.id.toLowerCase() === id.toLowerCase() && p.id !== editingId);
      if (dup) return alert(`이미 사용 중인 ID예요: ${dup.id} (${dup.name})`);

      if (editingId) {
        const p = products.find((x) => x.id === editingId);
        Object.assign(p, { id, name, price });
        showToast('수정했어요', 'ok');
      } else {
        products.push({ id, name, price });
        showToast('추가했어요', 'ok');
      }
      editingId = null;
      save(KEYS.products, products);
      resetForm();
    });

    $('cancelBtn').addEventListener('click', resetForm);

    $('productRows').addEventListener('click', (e) => {
      const editIdx = e.target.dataset.edit;
      const delIdx = e.target.dataset.del;
      if (editIdx !== undefined) {
        const p = products[editIdx];
        editingId = p.id;
        $('fId').value = p.id;
        $('fName').value = p.name;
        $('fPrice').value = p.price;
        $('submitBtn').textContent = '저장';
        $('cancelBtn').classList.remove('hidden');
        render();
        $('fName').focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (delIdx !== undefined) {
        const p = products[delIdx];
        if (!confirm(`"${p.name}" 상품을 삭제할까요?`)) return;
        products.splice(delIdx, 1);
        if (editingId === p.id) resetForm();
        persist();
      }
    });

    $('restoreBtn').addEventListener('click', async () => {
      if (!confirm('지금 상품 목록을 지우고 products.json 기본 상품으로 되돌릴까요?')) return;
      products = await fetchDefaultProducts();
      resetForm();
      persist();
    });

    $('printBtn').addEventListener('click', () => {
      if (products.length === 0) return alert('인쇄할 상품이 없어요.');
      const grid = $('printGrid');
      grid.innerHTML = products.map((p, idx) => `
        <div class="print-card">
          <div class="qr" data-pqr="${idx}"></div>
          <div class="p-name">${escapeHtml(p.name)}</div>
          <div class="p-price">${won(p.price)}</div>
          <div class="p-id">${escapeHtml(p.id)}</div>
        </div>`).join('');
      grid.querySelectorAll('[data-pqr]').forEach((el) => makeQr(el, products[el.dataset.pqr].id, 400));
      // qrcode.js가 이미지를 만들 시간을 조금 준 뒤 인쇄
      setTimeout(() => window.print(), 300);
    });

    (async function init() {
      fillSettings();
      products = await loadProducts();
      render();
    })();
  </script>
</body>
</html>
